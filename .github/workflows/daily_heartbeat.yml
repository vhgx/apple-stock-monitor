name: 2. Aviso Diario - Produto Apple Checado (11:30 BRT)

on:
  schedule:
    # 11:30 no horário de Brasília (UTC-3) = 14:30 no horário UTC
    - cron: '32 14 * * *'
  workflow_dispatch: # Permite disparar manualmente para testar o recebimento

jobs:
  daily-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Daily Heartbeat Email
        env:
          PART_NUMBER: "MK1G4LL/A"
          PRODUCT_NAME: "iPhone Duo 512GB Star White"
          ZIP_CODE: "10001"
          SMTP_SERVER: "smtp-mail.outlook.com"
          SMTP_PORT: "587"
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 apple_monitor.py --heartbeat
